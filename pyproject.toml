[project]
name = "nohourtodie"
version = "0.1.0"
description = "GoldenHour fleet planner (module A) and Destination Advisor (module B) for Karnataka 108"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyarrow>=15",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
sim = ["simpy>=4.1"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
