<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bikeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Outer Badge Pin -->
  <circle cx="32" cy="32" r="28" fill="url(#bikeGrad)" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <!-- Motorcycle Silhouette -->
  <!-- Wheels -->
  <circle cx="20" cy="38" r="7" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="44" cy="38" r="7" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="20" cy="38" r="2.5" fill="#94a3b8"/>
  <circle cx="44" cy="38" r="2.5" fill="#94a3b8"/>
  <!-- Bike Frame & Paramedic Body -->
  <path d="M 20 38 L 29 28 L 38 28 L 44 38 M 29 28 L 25 21 L 22 21 M 38 28 L 34 38 L 20 38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Emergency Medical Kit Box on Rear -->
  <rect x="15" y="24" width="8" height="7" rx="1.5" fill="#ffffff"/>
  <rect x="17" y="27" width="4" height="1.5" fill="#dc2626"/>
  <rect x="18.25" y="25.75" width="1.5" height="4" fill="#dc2626"/>
  <!-- Paramedic Helmet Head -->
  <circle cx="32" cy="18" r="4.5" fill="#ffffff"/>
  <!-- Bike Label Pill -->
  <rect x="18" y="47" width="28" height="10" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="1"/>
  <text x="32" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#f8fafc" text-anchor="middle">BIKE</text>
</svg>
